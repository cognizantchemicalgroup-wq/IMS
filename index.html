<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="js/security-deterrent.js" defer></script>
  <meta name="robots" content="noindex, nofollow" />
  <title>Sign in · CCPL ERP</title>
  <link rel="icon" href="logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="login-page">
    <section class="login-art">
      <img src="logo.png" alt="" style="height:56px;width:auto;background:#fff;border-radius:12px;padding:6px 10px;align-self:flex-start" />
      <div>
        <h1>Cognizant Chemical<br />Enterprise Resource Planning</h1>
        <div class="gold-line"></div>
        <p>Purchase orders, inward &amp; kanta, GRN, stock across PG-106, PG-153, Breeze and Taloja, sales orders and dispatch in one place.</p>
      </div>
      <p class="small">Authorised personnel only. All activity is logged.</p>
    </section>
    <section class="login-form-wrap">
      <div class="login-card">
        <img src="logo.png" alt="CCPL" />
        <h2>Sign in</h2>
        <p>Use the ERP credentials issued to you by the administrator.</p>
        <form id="loginForm" novalidate>
          <label class="field"><span>Email</span><input type="email" name="email" autocomplete="username" required /></label>
          <label class="field"><span>Password</span><input type="password" name="password" autocomplete="current-password" required /></label>
          <div id="loginMessage" role="alert"></div>
          <button class="btn primary" type="submit" id="loginBtn"><i class="fa-solid fa-lock"></i> Sign in securely</button>
          <button class="btn ghost small" type="button" id="resetBtn">Forgot password?</button>
        </form>
      </div>
    </section>
  </div>
  <script type="module" src="js/login.js?v=2.1"></script>
</body>
</html>
